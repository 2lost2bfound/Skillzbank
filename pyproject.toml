[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skillsbank"
version = "1.0.0"
description = "Universal agent-skill registry — search, recommend, compose, and manage AI agent skills."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
readme = "README.md"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "click>=8.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
    "httpx",
]

[project.scripts]
skillsbank = "skillsbank.cli:main"

[project.urls]
Homepage = "https://github.com/2lost2bfound/Skillzbank"
"Repository" = "https://github.com/2lost2bfound/Skillzbank"
"Issues" = "https://github.com/2lost2bfound/Skillzbank/issues"
"Documentation" = "https://github.com/2lost2bfound/Skillzbank#readme"
"Release Notes" = "https://github.com/2lost2bfound/Skillzbank/releases"

[tool.setuptools.packages.find]
include = ["skillsbank*"]

[tool.setuptools.package-data]
skillsbank = [
    "alembic/*.ini",
    "alembic/*.mako",
    "alembic/README",
    "alembic/versions/*.py",
    "alembic/env.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration (deselect with '-m \"not integration\"')",
]
filterwarnings = [
    "ignore:Using.*httpx.*starlette.*testclient.*deprecated:DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
ignore = [
    "F401",
    "BLE001",
    "PLW0602",
    "SIM102",
    "RUF034",
    "PLC0206",
]
