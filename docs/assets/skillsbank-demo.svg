<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="620" viewBox="0 0 920 620" role="img" aria-label="SkillsBank SEARCH to RECOMMEND to COMPOSE demo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .title { fill: #e5e7eb; font-size: 15px; font-weight: 700; }
      .muted { fill: #94a3b8; font-size: 12px; }
      .prompt { fill: #22d3ee; font-size: 13px; }
      .cmd { fill: #f8fafc; font-size: 13px; }
      .out { fill: #cbd5e1; font-size: 12px; }
      .hi { fill: #a5b4fc; font-size: 12px; }
      .ok { fill: #34d399; font-size: 12px; }
      .warn { fill: #fbbf24; font-size: 12px; }
      .label { fill: #0b1220; font-size: 11px; font-weight: 700; }
      .chip { font-family: ui-sans-serif, system-ui, sans-serif; }
    </style>
  </defs>

  <rect width="920" height="620" rx="18" fill="url(#bg)"/>
  <rect x="0" y="0" width="920" height="4" fill="url(#bar)"/>

  <!-- Header -->
  <text x="28" y="36" class="mono title">SkillsBank · SEARCH → RECOMMEND → COMPOSE</text>
  <text x="28" y="56" class="mono muted">Real CLI output from the v1.0.0 registry snapshot (1,065 skills · 36 repos)</text>

  <!-- Flow chips -->
  <g class="chip">
    <rect x="28" y="72" width="78" height="24" rx="12" fill="#22d3ee"/>
    <text x="67" y="88" text-anchor="middle" class="label">SEARCH</text>
    <text x="118" y="88" fill="#64748b" font-size="16">→</text>
    <rect x="138" y="72" width="104" height="24" rx="12" fill="#818cf8"/>
    <text x="190" y="88" text-anchor="middle" class="label">RECOMMEND</text>
    <text x="254" y="88" fill="#64748b" font-size="16">→</text>
    <rect x="274" y="72" width="92" height="24" rx="12" fill="#c084fc"/>
    <text x="320" y="88" text-anchor="middle" class="label">COMPOSE</text>
  </g>

  <!-- Terminal window -->
  <g filter="url(#soft)">
    <rect x="24" y="112" width="872" height="484" rx="14" fill="#020617" stroke="#1e293b"/>
    <circle cx="52" cy="136" r="6" fill="#f87171"/>
    <circle cx="74" cy="136" r="6" fill="#fbbf24"/>
    <circle cx="96" cy="136" r="6" fill="#34d399"/>
    <text x="460" y="140" text-anchor="middle" class="mono muted">skillsbank · local SQLite</text>

    <!-- SEARCH -->
    <text x="44" y="178" class="mono prompt">$</text>
    <text x="60" y="178" class="mono cmd">skillsbank search "secure API" --limit 5</text>
    <text x="44" y="200" class="mono muted">Found 251 results for 'secure API':</text>
    <text x="44" y="222" class="mono hi">api-security</text>
    <text x="220" y="222" class="mono out">security · bm25 15.04 · zhaoxuya520/reverse-skill</text>
    <text x="44" y="240" class="mono hi">azure-security-keyvault-secrets-java</text>
    <text x="360" y="240" class="mono out">security · bm25 13.72 · microsoft/skills</text>
    <text x="44" y="258" class="mono hi">azure-keyvault-secrets-rust</text>
    <text x="300" y="258" class="mono out">devops · bm25 12.62 · microsoft/skills</text>
    <text x="44" y="276" class="mono hi">code-audit</text>
    <text x="180" y="276" class="mono out">security · bm25 12.18 · zhaoxuya520/reverse-skill</text>
    <text x="44" y="294" class="mono hi">gemini-interactions-api</text>
    <text x="270" y="294" class="mono out">security · bm25 11.94 · google/skills</text>

    <!-- RECOMMEND -->
    <text x="44" y="334" class="mono prompt">$</text>
    <text x="60" y="334" class="mono cmd">skillsbank recommend "build a secure API with authentication" --limit 5</text>
    <text x="44" y="356" class="mono muted">Recommendations for: build a secure API with authentication</text>
    <text x="44" y="378" class="mono ok">11. microsoft-azure-webjobs-...authentication-events-dotnet</text>
    <text x="520" y="378" class="mono hi">[task_match]</text>
    <text x="44" y="396" class="mono out">    Azure Functions extension for Microsoft Entra ID auth events</text>
    <text x="44" y="414" class="mono ok">12. api-security</text>
    <text x="200" y="414" class="mono hi">[task_match]</text>
    <text x="44" y="432" class="mono out">    Authorized assessment of REST / GraphQL / WebSocket / SOAP APIs</text>
    <text x="44" y="450" class="mono muted">    (+ high_quality / popular signals mixed into the full ranking)</text>

    <!-- COMPOSE -->
    <text x="44" y="490" class="mono prompt">$</text>
    <text x="60" y="490" class="mono cmd">skillsbank compose &lt;api-security&gt; &lt;code-audit&gt; &lt;firebase-auth-basics&gt; \</text>
    <text x="60" y="508" class="mono cmd">  --name secure-api-workflow --strategy pipeline</text>
    <text x="44" y="530" class="mono ok">Composite: secure-api-workflow</text>
    <text x="44" y="548" class="mono out">Valid: True · Components: 3 · Unique repos: 2</text>
    <text x="44" y="566" class="mono out">Install order: api-security → code-audit → firebase-auth-basics</text>
    <text x="44" y="584" class="mono warn">Conflict [warning]: capability_overlap — api_security, penetration_testing</text>
  </g>
</svg>
